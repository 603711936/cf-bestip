name: CF IP Multi-Region Scanner V2

on:
  schedule:
    - cron: "15 */1 * * *"  # 每小时运行一次
  workflow_dispatch:  # 支持手动触发
    inputs:
      test_mode:
        description: '测试模式（仅运行内部测试）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl --version

      - name: Create requirements.txt
        run: |
          cat > requirements.txt << EOF
          requests>=2.31.0
          beautifulsoup4>=4.12.0
          lxml>=4.9.0
          EOF

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip list

      - name: Verify dependencies
        run: |
          python -c "import requests; print(f'requests: {requests.__version__}')"
          python -c "import bs4; print(f'beautifulsoup4: {bs4.__version__}')"
          python -c "import subprocess; print('subprocess: OK')"

      - name: Create output directories
        run: |
          mkdir -p public/data
          ls -la

      - name: Run internal tests
        id: test
        run: |
          python << 'EOF'
          import sys
          sys.path.insert(0, '.')
          
          # 导入并运行测试
          try:
              from tests import run_internal_tests
              
              print("🔍 开始运行内部测试...")
              result = run_internal_tests()
              
              if result:
                  print("✅ 内部测试通过")
                  sys.exit(0)
              else:
                  print("⚠️ 内部测试部分失败，但允许继续")
                  sys.exit(0)  # 允许部分失败
          except Exception as e:
              print(f"❌ 测试失败: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF
        continue-on-error: false

      - name: Run multi-region scan
        if: github.event.inputs.test_mode != 'true'
        run: |
          echo "🚀 开始执行多地区扫描..."
          python ip.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          WEBSHARE_TOKEN: ${{ secrets.WEBSHARE_TOKEN }}
        timeout-minutes: 90

      - name: Verify output files
        if: github.event.inputs.test_mode != 'true'
        run: |
          echo "📁 检查输出文件..."
          ls -lh public/
          
          echo ""
          echo "=== 核心文件检查 ==="
          
          # 检查 IP 总列表
          if [ -f "public/ip_all.txt" ]; then
            echo "✅ ip_all.txt 存在"
            LINE_COUNT=$(wc -l < public/ip_all.txt)
            echo "   总行数: $LINE_COUNT"
          else
            echo "❌ ip_all.txt 不存在"
          fi
          
          # 检查代理总列表
          if [ -f "public/proxy_all.txt" ]; then
            echo "✅ proxy_all.txt 存在"
            PROXY_COUNT=$(wc -l < public/proxy_all.txt)
            echo "   总行数: $PROXY_COUNT"
          else
            echo "⚠️ proxy_all.txt 不存在"
          fi
          
          # 检查 JSON
          if [ -f "public/ip_candidates.json" ]; then
            echo "✅ ip_candidates.json 存在"
            echo "   预览内容:"
            cat public/ip_candidates.json | python -m json.tool | head -30
          else
            echo "❌ ip_candidates.json 不存在"
          fi
          
          # 检查 HTML (修复 stat 命令)
          if [ -f "public/index.html" ]; then
            echo "✅ index.html 存在"
            SIZE=$(stat -c%s public/index.html 2>/dev/null || echo "unknown")
            echo "   文件大小: $SIZE bytes"
          else
            echo "❌ index.html 不存在"
          fi
          
          echo ""
          echo "=== 各地区文件统计 ==="
          
          # 统计 IP 文件
          echo "📍 IP 文件:"
          for file in public/ip_*.txt; do
            if [ -f "$file" ] && [ "$file" != "public/ip_all.txt" ]; then
              filename=$(basename "$file")
              count=$(wc -l < "$file" 2>/dev/null || echo "0")
              echo "  $filename: $count 行"
            fi
          done
          
          # 统计代理文件
          echo ""
          echo "🔑 代理文件:"
          for file in public/proxy_*.txt; do
            if [ -f "$file" ] && [ "$file" != "public/proxy_all.txt" ]; then
              filename=$(basename "$file")
              count=$(wc -l < "$file" 2>/dev/null || echo "0")
              echo "  $filename: $count 行"
            fi
          done

      - name: Validate HTML output
        if: github.event.inputs.test_mode != 'true'
        run: |
          echo "🔍 验证 HTML 文件..."
          
          if [ ! -f "public/index.html" ]; then
            echo "❌ index.html 不存在，尝试检查原因..."
            ls -la public/
            exit 1
          fi
          
          # 检查 HTML 文件是否包含关键内容
          if grep -q "Cloudflare IP 优选" public/index.html; then
            echo "✅ HTML 标题正确"
          else
            echo "⚠️ HTML 标题可能不正确"
          fi
          
          if grep -q "region-card" public/index.html; then
            echo "✅ HTML 包含地区卡片"
          else
            echo "⚠️ HTML 可能缺少地区卡片"
          fi
          
          if grep -q "proxy-item" public/index.html; then
            echo "✅ HTML 包含代理信息"
          else
            echo "⚠️ HTML 可能缺少代理信息"
          fi
          
          # 显示 HTML 文件大小 (修复 stat 命令)
          SIZE=$(stat -c%s public/index.html 2>/dev/null || echo "unknown")
          echo "📊 HTML 文件大小: $SIZE bytes"

      - name: Create .nojekyll
        if: github.event.inputs.test_mode != 'true'
        run: |
          touch public/.nojekyll
          echo "✅ .nojekyll 创建成功"

      - name: Upload artifacts
        if: always() && github.event.inputs.test_mode != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: |
            public/
            !public/data/
          retention-days: 7
          compression-level: 9

      - name: Generate summary
        if: github.event.inputs.test_mode != 'true'
        run: |
          echo "## 📊 扫描结果摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "public/ip_candidates.json" ]; then
            python << 'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          from datetime import datetime
          
          try:
              with open('public/ip_candidates.json', 'r') as f:
                  data = json.load(f)
              
              meta = data.get('meta', {})
              regions = meta.get('regions', {})
              nodes = data.get('nodes', [])
              
              print(f"### ✅ 扫描成功完成")
              print("")
              print(f"**生成时间**: {meta.get('generated_at', 'N/A')}")
              print(f"**版本**: {meta.get('version', 'N/A')}")
              print(f"**测试域名**: {meta.get('test_domain', 'N/A')}")
              print("")
              print(f"### 📈 统计数据")
              print("")
              print(f"- 🌐 **总节点数**: {meta.get('total_nodes', 0)}")
              print(f"- 🔑 **总代理数**: {meta.get('total_proxies', 0)}")
              print(f"- 📍 **覆盖地区**: {len(regions)}")
              print("")
              print("### 🗺️ 各地区节点分布")
              print("")
              print("| 地区代码 | 节点数 | 代理数 |")
              print("|---------|--------|--------|")
              
              # 读取代理文件统计
              import os
              for region, count in sorted(regions.items(), key=lambda x: x[1], reverse=True):
                  proxy_file = f'public/proxy_{region}.txt'
                  proxy_count = 0
                  if os.path.exists(proxy_file):
                      with open(proxy_file, 'r') as pf:
                          proxy_count = len(pf.readlines())
                  print(f"| {region} | {count} | {proxy_count} |")
              
              print("")
              print("### 🏆 Top 10 节点")
              print("")
              print("| 排名 | IP:端口 | 地区 | COLO | 评分 | 延迟 |")
              print("|------|---------|------|------|------|------|")
              
              for i, node in enumerate(nodes[:10], 1):
                  latencies = node.get('latencies', [])
                  avg_lat = f"{sum(latencies)/len(latencies):.0f}ms" if latencies else "N/A"
                  print(f"| {i} | `{node['ip']}:{node['port']}` | {node['region']} | {node.get('colo', 'N/A')} | {node['score']:.4f} | {avg_lat} |")
              
              print("")
              print("### 📥 下载链接")
              print("")
              print("- [全部IP列表](ip_all.txt)")
              print("- [全部代理列表](proxy_all.txt)")
              print("- [JSON数据](ip_candidates.json)")
              print("- [网页版](index.html)")
              
          except Exception as e:
              print(f"### ❌ 读取结果失败")
              print(f"")
              print(f"错误信息: {e}")
              import traceback
              print(f"")
              print(f"```")
              print(traceback.format_exc())
              print(f"```")
          EOF
          else
            echo "### ⚠️ 未找到扫描结果" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "JSON 文件不存在，请检查扫描过程是否正常执行。" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish to GitHub Pages
        if: github.event.inputs.test_mode != 'true' && success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy: Run #${{ github.run_number }} - ${{ github.event.head_commit.message }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Clean old artifacts
        if: github.event.inputs.test_mode != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const days = 7;
            const maxArtifacts = 10;
            
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            
            let deleted = 0;
            const sorted = artifacts.data.artifacts.sort((a, b) => 
              new Date(b.created_at) - new Date(a.created_at)
            );
            
            for (const [index, artifact] of sorted.entries()) {
              if (index >= maxArtifacts || new Date(artifact.created_at) < cutoff) {
                console.log(`Deleting artifact: ${artifact.name} (${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                deleted++;
              }
            }
            
            console.log(`Deleted ${deleted} old artifacts`);

      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 工作流执行成功"
            echo ""
            echo "📊 结果摘要:"
            
            if [ -f "public/ip_all.txt" ]; then
              IP_COUNT=$(wc -l < public/ip_all.txt)
              echo "  - IP节点: $IP_COUNT"
            fi
            
            if [ -f "public/proxy_all.txt" ]; then
              PROXY_COUNT=$(wc -l < public/proxy_all.txt)
              echo "  - 代理节点: $PROXY_COUNT"
            fi
            
            if [ -f "public/index.html" ]; then
              echo "  - HTML页面: ✅ 已生成"
            fi
            
            echo ""
            echo "🌐 访问: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            echo "❌ 工作流执行失败"
            echo "请查看日志了解详细信息"
          fi
